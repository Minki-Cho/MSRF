name: Windows Build & Demo Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (${{ matrix.configuration }}|x64)
        run: |
          msbuild MSFR/MSFR.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      - name: Demo smoke run (auto-exit)
        shell: pwsh
        run: |
          ./scripts/demo-smoke.ps1 -Configuration ${{ matrix.configuration }} -AutoExitMs 7000

      - name: Upload Trace log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-log-${{ matrix.configuration }}
          path: MSFR/Trace.log
          if-no-files-found: ignore
